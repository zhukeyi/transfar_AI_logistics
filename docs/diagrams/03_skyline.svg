<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 660" width="1120" height="660" role="img" aria-label="平面分层与天际线对比"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66788f"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="660.0" fill="#ffffff"/><text x="40.0" y="42.0" font-size="21.0" fill="#16202e" text-anchor="start" font-weight="600">装载高度场：全局平面分层 vs 天际线（高度场）</text><text x="40.0" y="70.0" font-size="12.6" fill="#66788f" text-anchor="start" font-weight="400">同为 2600×1400×1300 车厢、同一批货；差别只在「第二层从哪里起铺」</text><rect x="40.0" y="96.0" width="500.0" height="512.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="96.0" width="500.0" height="4.0" fill="#b3261e"/><rect x="56.0" y="112.0" width="80.0" height="26.0" rx="13.0" fill="#b3261e"/><text x="66.0" y="130.0" font-size="12.4" fill="#ffffff" text-anchor="start" font-weight="600">方案 A</text><text x="56.0" y="166.0" font-size="14.6" fill="#16202e" text-anchor="start" font-weight="600">平面分层（初版，被否决）</text><rect x="60.0" y="200.0" width="460.0" height="300.0" rx="3.0" fill="#ffffff" stroke="#66788f" stroke-width="1.3"/><line x1="60.0" y1="500.0" x2="520.0" y2="500.0" stroke="#66788f" stroke-width="2.0"/><rect x="60.0" y="296.9" width="276.0" height="203.1" fill="#e8effc" stroke="#1d4ed8" stroke-width="1.2"/><text x="198.0" y="398.4" font-size="11.6" fill="#1d4ed8" text-anchor="middle" font-weight="400">轮椅 880 mm</text><rect x="336.0" y="449.2" width="184.0" height="50.8" fill="#eef2f7" stroke="#b9c7da" stroke-width="1.2"/><text x="428.0" y="474.6" font-size="11.6" fill="#3d4c60" text-anchor="middle" font-weight="400">小件 220 mm</text><line x1="60.0" y1="296.9" x2="520.0" y2="296.9" stroke="#b3261e" stroke-width="1.6" stroke-dasharray="6 4"/><text x="516.0" y="288.9" font-size="11.2" fill="#b3261e" text-anchor="end" font-weight="400">层1 顶面 = 880（取全局最高）</text><rect x="376.0" y="246.1" width="120.0" height="50.8" rx="3.0" fill="#ffffff" stroke="#b3261e" stroke-width="1.4"/><text x="436.0" y="271.5" font-size="11.4" fill="#b3261e" text-anchor="middle" font-weight="400">层2 货箱</text><line x1="436.0" y1="296.9" x2="436.0" y2="449.2" stroke="#b3261e" stroke-width="1.4" marker-end="url(#ahr)"/><line x1="430.0" y1="296.9" x2="442.0" y2="296.9" stroke="#b3261e" stroke-width="1.4"/><text x="446.0" y="373.1" font-size="11.6" fill="#b3261e" text-anchor="start" font-weight="600">悬空 660 mm</text><text x="64.0" y="534.0" font-size="12.4" fill="#3d4c60" text-anchor="start" font-weight="400">层 2 强制从层1 最高点 880 mm 起铺；</text><text x="64.0" y="554.0" font-size="12.4" fill="#3d4c60" text-anchor="start" font-weight="400">矮堆上方 660 mm 空洞判为悬空，支撑率 0 被拒。</text><text x="64.0" y="578.0" font-size="12.4" fill="#b3261e" text-anchor="start" font-weight="600">结果：层 2 仅装入 1 件。</text><rect x="580.0" y="96.0" width="500.0" height="512.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="580.0" y="96.0" width="500.0" height="4.0" fill="#15803d"/><rect x="596.0" y="112.0" width="80.0" height="26.0" rx="13.0" fill="#15803d"/><text x="606.0" y="130.0" font-size="12.4" fill="#ffffff" text-anchor="start" font-weight="600">方案 B</text><text x="596.0" y="166.0" font-size="14.6" fill="#16202e" text-anchor="start" font-weight="600">天际线 / 高度场（采用）</text><rect x="600.0" y="200.0" width="460.0" height="300.0" rx="3.0" fill="#ffffff" stroke="#66788f" stroke-width="1.3"/><line x1="600.0" y1="500.0" x2="1060.0" y2="500.0" stroke="#66788f" stroke-width="2.0"/><rect x="600.0" y="296.9" width="276.0" height="203.1" fill="#e8effc" stroke="#1d4ed8" stroke-width="1.2"/><text x="738.0" y="398.4" font-size="11.6" fill="#1d4ed8" text-anchor="middle" font-weight="400">轮椅 880 mm</text><rect x="876.0" y="449.2" width="184.0" height="50.8" fill="#eef2f7" stroke="#b9c7da" stroke-width="1.2"/><text x="968.0" y="474.6" font-size="11.6" fill="#3d4c60" text-anchor="middle" font-weight="400">小件 220 mm</text><path d="M 600,296.89599999999996 L 876.0,296.89599999999996 L 876.0,449.224 L 1060,449.224" fill="none" stroke="#15803d" stroke-width="2.0" stroke-dasharray="7 4"/><text x="1056.0" y="441.2" font-size="11.2" fill="#15803d" text-anchor="end" font-weight="400">天际线（逐点取实测顶面）</text><rect x="376.0" y="246.1" width="120.0" height="50.8" rx="3.0" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/><text x="436.0" y="271.5" font-size="11.4" fill="#15803d" text-anchor="middle" font-weight="400">层2 货箱</text><rect x="916.0" y="393.8" width="120.0" height="55.4" rx="3.0" fill="#ffffff" stroke="#15803d" stroke-width="1.4"/><text x="976.0" y="421.5" font-size="11.4" fill="#15803d" text-anchor="middle" font-weight="400">层2 货箱</text><line x1="976.0" y1="389.8" x2="976.0" y2="453.2" stroke="#15803d" stroke-width="1.4"/><text x="984.0" y="450.4" font-size="11.4" fill="#15803d" text-anchor="start" font-weight="400">坐实于 220</text><text x="604.0" y="534.0" font-size="12.4" fill="#3d4c60" text-anchor="start" font-weight="400">每件货落在其投影范围内容积最低的天际线高度上；</text><text x="604.0" y="554.0" font-size="12.4" fill="#3d4c60" text-anchor="start" font-weight="400">矮堆上方继续码货，高堆旁边就近补货，不再出现悬空。</text><text x="604.0" y="578.0" font-size="12.4" fill="#15803d" text-anchor="start" font-weight="600">结果：全部订单 100% 装载，V2 达 91.45%，违规 0。</text></svg>