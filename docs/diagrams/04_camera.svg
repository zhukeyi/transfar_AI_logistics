<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 600" width="1120" height="600" role="img" aria-label="双机位与逐步可指引率"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66788f"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="600.0" fill="#ffffff"/><text x="40.0" y="42.0" font-size="21.0" fill="#16202e" text-anchor="start" font-weight="600">车载相机：双机位在进深方向互补</text><text x="40.0" y="70.0" font-size="12.6" fill="#66788f" text-anchor="start" font-weight="400">不报「满载可辨率」，报「放入第 k 件时该件落位面是否可见」——即逐步可指引率</text><rect x="40.0" y="96.0" width="520.0" height="470.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="96.0" width="520.0" height="4.0" fill="#0f766e"/><text x="60.0" y="128.0" font-size="13.6" fill="#16202e" text-anchor="start" font-weight="600">俯视：车厢 2600 × 1400 mm（V1 微面）</text><rect x="90.0" y="200.0" width="440.0" height="238.0" rx="3.0" fill="#ffffff" stroke="#66788f" stroke-width="1.3"/><line x1="90.0" y1="200.0" x2="90.0" y2="438.0" stroke="#0f766e" stroke-width="3.0"/><text x="104.0" y="426.0" font-size="11.6" fill="#0f766e" text-anchor="start" font-weight="600">尾门</text><text x="520.0" y="426.0" font-size="11.6" fill="#66788f" text-anchor="end" font-weight="400">车头</text><rect x="116.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="116.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="116.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="184.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="184.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="184.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="252.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="252.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="252.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="320.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="320.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="320.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="388.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="388.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="388.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="456.0" y="222.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="456.0" y="294.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><rect x="456.0" y="366.0" width="58.0" height="60.0" rx="2.0" fill="#eef2f7" stroke="#b9c7da" stroke-width="0.9"/><polygon points="100.0,214.0 300.0,204.0 300.0,434.0 100.0,424.0" fill="#0f766e" opacity="0.14"/><polygon points="98.0,210.0 110.0,226.0 110.0,412.0 98.0,428.0" fill="#0f766e"/><text x="98.0" y="188.0" font-size="11.6" fill="#0f766e" text-anchor="start" font-weight="600">尾门后视相机  偏航 8° / 俯仰 −14° / HFOV 150°</text><polygon points="518.0,240.0 240.0,214.0 240.0,424.0 518.0,398.0" fill="#a35a06" opacity="0.14"/><polygon points="522.0,303.0 522.0,335.0 536.0,319.0" fill="#a35a06"/><text x="522.0" y="460.0" font-size="11.6" fill="#a35a06" text-anchor="end" font-weight="600">顶棚俯视相机  偏航 180° / 俯仰 −32° / HFOV 170°</text><text x="60.0" y="486.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">两台相机在进深方向一降一升：后视越装越深、可见越差；俯视越深越开阔。</text><text x="60.0" y="508.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">这是「双机位」的设计依据，不是随意增加一台相机。</text><text x="60.0" y="538.0" font-size="12.0" fill="#66788f" text-anchor="start" font-weight="400">遮挡判定与投影均对独立实现做过交叉验证：</text><text x="60.0" y="558.0" font-size="12.0" fill="#66788f" text-anchor="start" font-weight="400">投影误差 &lt; 1e-3 px；160 条射线零不一致。</text><rect x="580.0" y="96.0" width="520.0" height="470.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="580.0" y="96.0" width="520.0" height="4.0" fill="#0f766e"/><text x="600.0" y="128.0" font-size="13.6" fill="#16202e" text-anchor="start" font-weight="600">逐步可指引率（按装载批次分 5 段）</text><line x1="636.0" y1="440.0" x2="1060.0" y2="440.0" stroke="#66788f" stroke-width="1.2"/><line x1="636.0" y1="440.0" x2="1060.0" y2="440.0" stroke="#b9c7da" stroke-width="0.8" stroke-dasharray="3 3"/><text x="630.0" y="444.0" font-size="10.4" fill="#66788f" text-anchor="end" font-weight="400">0</text><line x1="636.0" y1="375.0" x2="1060.0" y2="375.0" stroke="#b9c7da" stroke-width="0.8" stroke-dasharray="3 3"/><text x="630.0" y="379.0" font-size="10.4" fill="#66788f" text-anchor="end" font-weight="400">25</text><line x1="636.0" y1="310.0" x2="1060.0" y2="310.0" stroke="#b9c7da" stroke-width="0.8" stroke-dasharray="3 3"/><text x="630.0" y="314.0" font-size="10.4" fill="#66788f" text-anchor="end" font-weight="400">50</text><line x1="636.0" y1="245.0" x2="1060.0" y2="245.0" stroke="#b9c7da" stroke-width="0.8" stroke-dasharray="3 3"/><text x="630.0" y="249.0" font-size="10.4" fill="#66788f" text-anchor="end" font-weight="400">75</text><line x1="636.0" y1="180.0" x2="1060.0" y2="180.0" stroke="#b9c7da" stroke-width="0.8" stroke-dasharray="3 3"/><text x="630.0" y="184.0" font-size="10.4" fill="#66788f" text-anchor="end" font-weight="400">100</text><rect x="669.5" y="304.3" width="24.0" height="135.7" rx="2.0" fill="#0f766e"/><text x="681.5" y="298.3" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">52.2</text><rect x="698.5" y="355.2" width="24.0" height="84.8" rx="2.0" fill="#a35a06"/><text x="710.5" y="349.2" font-size="10.2" fill="#a35a06" text-anchor="middle" font-weight="600">32.6</text><text x="688.0" y="460.0" font-size="11.4" fill="#3d4c60" text-anchor="middle" font-weight="400">第 1 批</text><rect x="741.5" y="324.6" width="24.0" height="115.4" rx="2.0" fill="#0f766e"/><text x="753.5" y="318.6" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">44.4</text><rect x="770.5" y="382.3" width="24.0" height="57.7" rx="2.0" fill="#a35a06"/><text x="782.5" y="376.3" font-size="10.2" fill="#a35a06" text-anchor="middle" font-weight="600">22.2</text><text x="760.0" y="460.0" font-size="11.4" fill="#3d4c60" text-anchor="middle" font-weight="400">第 2 批</text><rect x="813.5" y="291.5" width="24.0" height="148.5" rx="2.0" fill="#0f766e"/><text x="825.5" y="285.5" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">57.1</text><rect x="842.5" y="272.8" width="24.0" height="167.2" rx="2.0" fill="#a35a06"/><text x="854.5" y="266.8" font-size="10.2" fill="#a35a06" text-anchor="middle" font-weight="600">64.3</text><text x="832.0" y="460.0" font-size="11.4" fill="#3d4c60" text-anchor="middle" font-weight="400">第 3 批</text><rect x="885.5" y="328.5" width="24.0" height="111.5" rx="2.0" fill="#0f766e"/><text x="897.5" y="322.5" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">42.9</text><rect x="914.5" y="254.4" width="24.0" height="185.6" rx="2.0" fill="#a35a06"/><text x="926.5" y="248.4" font-size="10.2" fill="#a35a06" text-anchor="middle" font-weight="600">71.4</text><text x="904.0" y="460.0" font-size="11.4" fill="#3d4c60" text-anchor="middle" font-weight="400">第 4 批</text><rect x="957.5" y="284.0" width="24.0" height="156.0" rx="2.0" fill="#0f766e"/><text x="969.5" y="278.0" font-size="10.2" fill="#0f766e" text-anchor="middle" font-weight="600">60.0</text><rect x="986.5" y="206.0" width="24.0" height="234.0" rx="2.0" fill="#a35a06"/><text x="998.5" y="200.0" font-size="10.2" fill="#a35a06" text-anchor="middle" font-weight="600">90.0</text><text x="976.0" y="460.0" font-size="11.4" fill="#3d4c60" text-anchor="middle" font-weight="400">第 5 批</text><rect x="660.0" y="150.0" width="12.0" height="12.0" rx="2.0" fill="#0f766e"/><text x="678.0" y="160.0" font-size="11.6" fill="#0f766e" text-anchor="start" font-weight="400">尾门后视  整体 51.0%</text><rect x="868.0" y="150.0" width="12.0" height="12.0" rx="2.0" fill="#a35a06"/><text x="886.0" y="160.0" font-size="11.6" fill="#a35a06" text-anchor="start" font-weight="400">顶棚俯视  整体 46.1%</text><text x="600.0" y="486.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">同一台相机在装载早期与后期表现不同：批次是按落位高度</text><text x="600.0" y="506.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">划分的，越晚的批次越靠上层与深处。</text><text x="600.0" y="538.0" font-size="12.0" fill="#66788f" text-anchor="start" font-weight="400">对比项：满载后静态可辨率仅 3.9%（后视）与 12.8%（俯视），</text><text x="600.0" y="558.0" font-size="12.0" fill="#66788f" text-anchor="start" font-weight="400">那是装载完成后的必然结果，不能代表指引能力。</text></svg>