<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 800" width="1120" height="800" role="img" aria-label="城市配送智能配载 系统架构"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66788f"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="800.0" fill="#ffffff"/><text x="40.0" y="42.0" font-size="21.0" fill="#16202e" text-anchor="start" font-weight="600">城市配送智能配载 · 系统架构</text><text x="40.0" y="70.0" font-size="13.0" fill="#66788f" text-anchor="start" font-weight="400">四层流水线，每层输出均可被独立程序复核；虚线为自主扩展的动态分支</text><rect x="40.0" y="100.0" width="1040.0" height="112.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="100.0" width="5.0" height="112.0" fill="#66788f"/><text x="60.0" y="120.0" font-size="13.5" fill="#66788f" text-anchor="start" font-weight="600">① 数据层  算例与主数据</text><rect x="64.0" y="138.0" width="484.0" height="62.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="76.0" y="159.0" font-size="13.2" fill="#16202e" text-anchor="start" font-weight="600">杭州路网  src/data/hangzhou_net.py</text><text x="76.0" y="178.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">中心仓 1 个 + 连锁门店 30 家（主城区，按方位分区）</text><text x="76.0" y="195.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">车型 3 种：新能源微面 / 依维柯厢货 / 4.2m 厢货</text><rect x="572.0" y="138.0" width="484.0" height="62.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="584.0" y="159.0" font-size="13.2" fill="#16202e" text-anchor="start" font-weight="600">订单与货物  src/data/goods.py</text><text x="584.0" y="178.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">医药 SKU 24 个：尺寸 / 重量 / 易碎 / 堆叠上限 / 可否倒置</text><text x="584.0" y="195.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">订单 67 张 1328 件：常规补货 46 / 电商即时 16 / 紧急要货 5</text><line x1="560.0" y1="212.0" x2="560.0" y2="248.0" stroke="#66788f" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40.0" y="248.0" width="1040.0" height="212.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="248.0" width="5.0" height="212.0" fill="#1d4ed8"/><text x="60.0" y="268.0" font-size="13.5" fill="#1d4ed8" text-anchor="start" font-weight="600">② 规划层  四个求解模块（共享同一车厢坐标系）</text><rect x="64.0" y="286.0" width="233.0" height="108.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="76.0" y="307.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">① 运力匹配与路线</text><text x="76.0" y="326.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">异构车队 VRPTW</text><text x="76.0" y="343.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">构造层 + 局部搜索</text><text x="76.0" y="360.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">输出停靠顺序</text><rect x="317.0" y="286.0" width="233.0" height="108.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="329.0" y="307.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">②a 仓内拣货配货</text><text x="329.0" y="326.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">S 形路径遍历</text><text x="329.0" y="343.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">深位优先消翻垛</text><text x="329.0" y="360.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">输出拣货序</text><line x1="299.0" y1="340.0" x2="315.0" y2="340.0" stroke="#b9c7da" stroke-width="1.4" marker-end="url(#ahb)"/><rect x="570.0" y="286.0" width="233.0" height="108.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="582.0" y="307.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">②b 车厢三维装载</text><text x="582.0" y="326.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">货架定平面布局</text><text x="582.0" y="343.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">天际线定高度</text><text x="582.0" y="360.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">C1–C8 八项约束</text><line x1="552.0" y1="340.0" x2="568.0" y2="340.0" stroke="#b9c7da" stroke-width="1.4" marker-end="url(#ahb)"/><rect x="823.0" y="286.0" width="233.0" height="108.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="835.0" y="307.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">③ 装卸序与指引</text><text x="835.0" y="326.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">装载序 = 支撑拓扑</text><text x="835.0" y="343.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">卸货序 = 反转拓扑</text><text x="835.0" y="360.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">相机画面校验</text><line x1="805.0" y1="340.0" x2="821.0" y2="340.0" stroke="#b9c7da" stroke-width="1.4" marker-end="url(#ahb)"/><rect x="64.0" y="406.0" width="992.0" height="40.0" rx="6.0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.5" stroke-dasharray="5 3"/><text x="76.0" y="427.0" font-size="12.4" fill="#16202e" text-anchor="start" font-weight="600">动态分支（自主扩展）· 滚动时域派车</text><text x="76.0" y="446.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">每 120 min 触发一次；合并待派订单后只重解受影响子集，不冻结已在途任务</text><line x1="560.0" y1="460.0" x2="560.0" y2="496.0" stroke="#66788f" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40.0" y="496.0" width="1040.0" height="112.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="496.0" width="5.0" height="112.0" fill="#0f766e"/><text x="60.0" y="516.0" font-size="13.5" fill="#0f766e" text-anchor="start" font-weight="600">③ 校验层  独立实现交叉验证，不接受求解器自报数字</text><rect x="64.0" y="534.0" width="314.0" height="62.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="76.0" y="555.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">精确性交叉验证</text><text x="76.0" y="574.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">Held-Karp DP + 集合划分 MILP</text><text x="76.0" y="591.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">对启发式解给出最优性上界</text><rect x="403.0" y="534.0" width="314.0" height="62.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="415.0" y="555.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">装载约束审计器</text><text x="415.0" y="574.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">C1–C8 八项逐条判定</text><text x="415.0" y="591.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">算法与人工基线过同一审计器</text><rect x="742.0" y="534.0" width="314.0" height="62.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="754.0" y="555.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">相机模型自证</text><text x="754.0" y="574.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">投影比对解析解</text><text x="754.0" y="591.0" font-size="11.8" fill="#3d4c60" text-anchor="start" font-weight="400">遮挡比对暴力射线采样</text><line x1="560.0" y1="608.0" x2="560.0" y2="644.0" stroke="#66788f" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40.0" y="644.0" width="1040.0" height="118.0" rx="8.0" fill="#f6f8fb" stroke="#ccd7e6" stroke-width="1.0"/><rect x="40.0" y="644.0" width="5.0" height="118.0" fill="#a35a06"/><text x="60.0" y="664.0" font-size="13.5" fill="#a35a06" text-anchor="start" font-weight="600">④ 输出层  可交付物</text><rect x="64.0" y="682.0" width="233.0" height="66.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="76.0" y="703.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">三维布局</text><text x="76.0" y="722.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">逐件 x/y/z 坐标</text><text x="76.0" y="739.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">out/loading_plan.json</text><rect x="317.0" y="682.0" width="233.0" height="66.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="329.0" y="703.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">分步装卸指引</text><text x="329.0" y="722.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">装载序 + 卸货序</text><text x="329.0" y="739.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">out/delivery_aware.json</text><rect x="570.0" y="682.0" width="233.0" height="66.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="582.0" y="703.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">相机画面指引</text><text x="582.0" y="722.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">双机位可见性判定</text><text x="582.0" y="739.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">assets/camera/*.svg</text><rect x="823.0" y="682.0" width="233.0" height="66.0" rx="6.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="835.0" y="703.0" font-size="12.6" fill="#16202e" text-anchor="start" font-weight="600">成本对比报告</text><text x="835.0" y="722.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">算法 vs 人工基线</text><text x="835.0" y="739.0" font-size="11.6" fill="#3d4c60" text-anchor="start" font-weight="400">out/loading_compare.json</text></svg>