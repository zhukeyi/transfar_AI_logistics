<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 620" width="1120" height="620" role="img" aria-label="三子问题闭环与反向约束"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#66788f"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d4ed8"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15803d"/></marker></defs><rect x="0.0" y="0.0" width="1120.0" height="620.0" fill="#ffffff"/><text x="40.0" y="42.0" font-size="21.0" fill="#16202e" text-anchor="start" font-weight="600">三个子问题共用车厢坐标系：正向链与反向约束</text><text x="40.0" y="70.0" font-size="12.6" fill="#66788f" text-anchor="start" font-weight="400">正向：路线定送达顺序 → 装载定三维位置 → 装卸序与画面指引；反向：配送顺序想直接决定装载排序时会与物理支撑成环</text><rect x="60.0" y="110.0" width="250.0" height="146.0" rx="8.0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><rect x="60.0" y="110.0" width="250.0" height="4.0" fill="#1d4ed8"/><text x="72.0" y="140.0" font-size="13.4" fill="#16202e" text-anchor="start" font-weight="600">① 运力匹配与路线优化</text><text x="72.0" y="166.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">车、货、时、距综合</text><text x="72.0" y="186.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">输出：门店停靠顺序</text><text x="72.0" y="206.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">out/route_result.json</text><rect x="430.0" y="110.0" width="250.0" height="146.0" rx="8.0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><rect x="430.0" y="110.0" width="250.0" height="4.0" fill="#1d4ed8"/><text x="442.0" y="140.0" font-size="13.4" fill="#16202e" text-anchor="start" font-weight="600">② 多约束三维装载</text><text x="442.0" y="166.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">C1–C8 八项约束</text><text x="442.0" y="186.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">输出：逐件三维坐标</text><text x="442.0" y="206.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">out/loading_plan.json</text><rect x="800.0" y="110.0" width="250.0" height="146.0" rx="8.0" fill="#ffffff" stroke="#1d4ed8" stroke-width="1.4"/><rect x="800.0" y="110.0" width="250.0" height="4.0" fill="#1d4ed8"/><text x="812.0" y="140.0" font-size="13.4" fill="#16202e" text-anchor="start" font-weight="600">③ 装卸序与画面指引</text><text x="812.0" y="166.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">拓扑排序 + 相机校验</text><text x="812.0" y="186.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">输出：装载序 / 卸货序</text><text x="812.0" y="206.0" font-size="12.2" fill="#3d4c60" text-anchor="start" font-weight="400">out/delivery_aware.json</text><line x1="314.0" y1="206.0" x2="426.0" y2="206.0" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ahb)"/><rect x="314.0" y="130.0" width="112.0" height="40.0" rx="6.0" fill="#e8effc" stroke="#1d4ed8" stroke-width="1.0"/><text x="370.0" y="146.0" font-size="11.8" fill="#1d4ed8" text-anchor="middle" font-weight="600">送达顺序</text><text x="370.0" y="161.0" font-size="11.4" fill="#1d4ed8" text-anchor="middle" font-weight="400">驱动装载排序</text><line x1="684.0" y1="206.0" x2="796.0" y2="206.0" stroke="#1d4ed8" stroke-width="1.8" marker-end="url(#ahb)"/><rect x="684.0" y="130.0" width="112.0" height="40.0" rx="6.0" fill="#e8effc" stroke="#1d4ed8" stroke-width="1.0"/><text x="740.0" y="146.0" font-size="11.8" fill="#1d4ed8" text-anchor="middle" font-weight="600">三维支撑</text><text x="740.0" y="161.0" font-size="11.4" fill="#1d4ed8" text-anchor="middle" font-weight="400">生成卸货序</text><rect x="40.0" y="320.0" width="1040.0" height="258.0" rx="8.0" fill="#fceceb" stroke="#b3261e" stroke-width="1.5" stroke-dasharray="6 4"/><text x="64.0" y="352.0" font-size="15.0" fill="#b3261e" text-anchor="start" font-weight="600">反向约束：配送顺序不能写成硬偏序</text><text x="64.0" y="380.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">装载序的硬约束只有一条：下层先于上层（支撑关系）。</text><text x="64.0" y="401.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">若再把「停靠序号大的先装」也写成硬偏序，两条要求会互相冲突：</text><text x="64.0" y="422.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">  支撑关系要求「后送的货在下面」→ 后送先装</text><text x="64.0" y="443.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">  配送顺序要求「先送的货在里面」→ 先送先装</text><text x="64.0" y="464.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">同一个货位被两条规则反向指定，偏序图出现环，拓扑排序直接无解。</text><text x="64.0" y="485.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">处理方式：物理支撑保留为硬约束，配送顺序降级为目标函数，</text><text x="64.0" y="506.0" font-size="12.3" fill="#3d4c60" text-anchor="start" font-weight="400">并单独报告「不翻垛前提下不可能消除的逆序支撑对数量」作为物理下界。</text><rect x="760.0" y="366.0" width="270.0" height="176.0" rx="6.0" fill="#ffffff" stroke="#b3261e" stroke-width="1.2"/><text x="895.0" y="388.0" font-size="12.6" fill="#b3261e" text-anchor="middle" font-weight="600">偏序成环</text><rect x="780.0" y="404.0" width="230.0" height="38.0" rx="5.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="895.0" y="428.0" font-size="12.0" fill="#16202e" text-anchor="middle" font-weight="400">支撑要求：后送先装</text><rect x="780.0" y="486.0" width="230.0" height="38.0" rx="5.0" fill="#ffffff" stroke="#b9c7da" stroke-width="1.0"/><text x="895.0" y="510.0" font-size="12.0" fill="#16202e" text-anchor="middle" font-weight="400">配送要求：先送先装</text><path d="M 1004,444 C 1052,465 1052,485 1004,506" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ahr)"/><path d="M 786,506 C 738,485 738,465 786,444" fill="none" stroke="#b3261e" stroke-width="1.8" marker-end="url(#ahr)"/><text x="895.0" y="560.0" font-size="11.6" fill="#b3261e" text-anchor="middle" font-weight="400">两规则互为反向 ⇒ 拓扑排序报错</text></svg>